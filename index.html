<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFT-Coach Fallschirmjäger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BFT-Coach">
<meta name="theme-color" content="#2f3b2a">
<style>
  :root{
    --bg:#eef0eb; --ink:#141714; --muted:#677064; --line:rgba(20,30,20,.09);
    --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.78); --gline:rgba(255,255,255,.75); --fill:rgba(118,128,114,.13);
    --accent:#2f5f3a; --accent2:#3f7a4b; --accent-ink:#ffffff; --soft:rgba(63,122,75,.13);
    --warn:#b0620f; --bad:#b8392d; --ok:#2e8a4e; --okfill:rgba(46,138,78,.14);
    --shadow:0 10px 30px rgba(30,45,30,.08),0 1px 2px rgba(30,45,30,.06);
    --hl:inset 0 1px 0 rgba(255,255,255,.9);
    --b1:rgba(120,170,110,.38); --b2:rgba(150,185,215,.36); --b3:rgba(225,205,160,.34);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#090b09; --ink:#eef1ec; --muted:#98a294; --line:rgba(255,255,255,.08);
      --glass:rgba(38,42,38,.52); --glass2:rgba(44,49,44,.76); --gline:rgba(255,255,255,.09); --fill:rgba(255,255,255,.08);
      --accent:#8fd19a; --accent2:#8fd19a; --accent-ink:#0b130c; --soft:rgba(143,209,154,.14);
      --warn:#eaa257; --bad:#ef8273; --ok:#73d18e; --okfill:rgba(115,209,142,.15);
      --shadow:0 10px 30px rgba(0,0,0,.35); --hl:inset 0 1px 0 rgba(255,255,255,.06);
      --b1:rgba(70,130,80,.30); --b2:rgba(60,90,130,.28); --b3:rgba(120,100,60,.22); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:
    radial-gradient(40% 35% at 15% 8%,var(--b1),transparent 70%),
    radial-gradient(38% 32% at 95% 30%,var(--b2),transparent 70%),
    radial-gradient(45% 35% at 25% 95%,var(--b3),transparent 70%),var(--bg)}
  .glass,.card,.preset,.iconbtn,.day .c,nav,.modal .sheet,.exc,.stat{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gline);box-shadow:var(--shadow),var(--hl)}
  .glass-strong{background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--gline);box-shadow:var(--shadow),var(--hl)}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
  #scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
  .wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 120px}
  .modal .sheet{overscroll-behavior:none;overflow-x:hidden;touch-action:pan-y}
  .modal{overscroll-behavior:none}
  .modal .sheet *{max-width:100%}
  .grid2>*,.grid3>*,.grid4>*{min-width:0}
  input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:46px;text-align:left}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:10px 0 16px}
  .top h1{font-size:34px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.6px}
  .top .sub{font-size:14px;color:var(--muted);margin-top:5px}
  .iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;cursor:pointer}
  .iconbtn svg{width:20px;height:20px}
  .iconbtn:disabled{opacity:.3}
  .sec{font-size:15px;font-weight:700;margin:20px 4px 9px;display:flex;justify-content:space-between;align-items:baseline}
  .sec button.link,.link{font-size:14px;font-weight:600;color:var(--accent2);background:none;border:none;padding:0;cursor:pointer}
  .card{border-radius:24px;padding:4px 16px;margin:0 0 12px}
  .card.pad{padding:16px}
  .row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row.tap{cursor:pointer}
  .row .ic{width:40px;height:40px;border-radius:14px;background:var(--soft);color:var(--accent2);display:flex;align-items:center;justify-content:center;flex:none}
  .row .ic svg{width:20px;height:20px}
  .row .tx{flex:1;min-width:0}
  .row .t{font-weight:600}
  .row .m{font-size:13px;color:var(--muted);margin-top:1px}
  .row .end{flex:none;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:14px}
  .row .end svg{width:18px;height:18px}
  .done-dot{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}
  .done-dot svg{width:14px;height:14px}
  .muted{color:var(--muted);font-size:14px}
  .small{font-size:13px}
  button{font:inherit;border:none;border-radius:999px;padding:13px 16px;font-weight:600;cursor:pointer;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,opacity .12s}
  button:active{transform:scale(.97)}
  .btn{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);width:100%;box-shadow:0 6px 18px rgba(47,95,58,.25),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn2{background:var(--fill);color:var(--ink);width:100%}
  .btn-danger{background:var(--bad);color:#fff;width:100%}
  .btnrow{display:flex;gap:8px;margin-top:12px}
  .btnrow > *{flex:1}
  .mini{padding:8px 14px;font-size:14px;width:auto}
  .pill{padding:9px 16px;font-size:15px;background:var(--fill);color:var(--ink);width:auto}
  .pill.acc{background:var(--accent);color:var(--accent-ink)}
  .ghost{background:var(--fill);padding:9px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;width:auto}
  .ghost svg{width:16px;height:16px}
  .chip{background:var(--soft);color:var(--accent2);padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;width:auto;flex:none;font-variant-numeric:tabular-nums}
  .chip svg{width:15px;height:15px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  tr.cur td{font-weight:700}
  nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;border-radius:32px;display:flex;justify-content:space-around;padding:6px;z-index:5;background:var(--glass2)}
  nav button{flex:1;background:none;color:var(--muted);padding:7px 4px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:26px}
  nav button.on{color:var(--accent2);background:var(--soft)}
  nav svg{width:23px;height:23px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
  input,select,textarea{font:inherit;width:100%;padding:11px 13px;border-radius:14px;border:1px solid transparent;background:var(--fill);color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent2);background:var(--glass2)}
  input.need{border-color:var(--warn)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{border-radius:18px;padding:10px 12px}
  .stat .sv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer{font-size:60px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0;letter-spacing:-1.5px}
  .bar{height:8px;background:var(--fill);border-radius:5px;overflow:hidden;margin:8px 0}
  .bar > div{height:100%;background:var(--accent2);width:0;border-radius:5px}
  .bar.over > div{background:var(--warn)}
  .fb{border-radius:14px;background:var(--fill);padding:9px 12px;margin-top:10px;font-size:14px;font-weight:500;border-left:none;position:relative;padding-left:16px}
  .fb::before{content:"";position:absolute;left:7px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--muted)}
  .fb.ok::before{background:var(--ok)} .fb.warn::before{background:var(--warn)} .fb.bad::before{background:var(--bad)} .fb.info::before{background:var(--accent2)}
  ul.tips{margin:4px 0 0 18px;padding:0} ul.tips li{margin:6px 0}
  .scale{display:flex;gap:4px;flex-wrap:wrap}
  .scale button{flex:1;min-width:28px;padding:9px 0;background:var(--fill);font-weight:600;border-radius:12px}
  .scale button.sel{background:var(--accent);color:var(--accent-ink)}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
  .toggle input{width:auto;transform:scale(1.3);accent-color:var(--accent)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  #dlgModal{z-index:40}
  .modal .sheet{background:var(--glass2);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:16px 16px calc(28px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch}
  #sessModal .sheet{height:96vh;max-height:96vh}
  .sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .sheethead .ttl{font-weight:700;font-size:19px}
  .shead{position:sticky;top:-16px;z-index:3;margin:-16px -16px 12px;padding:14px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--glass2);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-bottom:1px solid var(--line);border-radius:30px 30px 0 0}
  .shead .sc{text-align:center;min-width:0}
  .shead .st,.st{font-weight:800;font-size:17px}
  .hidden{display:none !important}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted)}
  .tag.g{background:var(--soft);color:var(--accent2)}
  .days{display:flex;justify-content:space-between;margin:0 0 4px}
  .day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .day .c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--ink)}
  .day.today .c{border:2px solid var(--accent2)}
  .day.done .c{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .day.rest .c{background:transparent;box-shadow:none;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--muted)}
  .day.sel .c{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .day.sel{color:var(--ink);font-weight:600}
  .unit{border-radius:18px;padding:12px;margin-top:10px;background:var(--fill)}
  .unit .t{font-weight:700;font-size:16px}
  .exc{border-radius:24px;padding:14px;margin:0 0 12px}
  .exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .exn{font-weight:700;font-size:17px;color:var(--accent2)}
  .exf{display:flex;gap:8px;margin-top:10px}
  .sgrid{display:grid;grid-template-columns:34px 1fr 68px 60px 42px;gap:6px;align-items:center}
  .sgrid.sh{margin-top:12px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-align:center}
  .sgrid.sh div:nth-child(2){text-align:left}
  .srow{margin-top:4px;padding:3px 0;border-radius:14px;transition:background .2s}
  .srow.done{background:var(--okfill)}
  .srow .no{text-align:center;font-weight:700;font-size:14px}
  .srow .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow input{padding:9px 4px;text-align:center;border-radius:11px;font-weight:600;font-variant-numeric:tabular-nums}
  .srow input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
  .srow.done input{background:transparent}
  .chk{width:40px;height:38px;border-radius:12px;background:var(--fill);color:var(--muted);padding:0;display:flex;align-items:center;justify-content:center}
  .chk svg{width:18px;height:18px}
  .chk.on{background:var(--ok);color:#fff}
  .restbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;border-radius:28px;padding:12px 14px;z-index:30}
  .restbar .rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .restbar .rt{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .restbar .rbtns{display:flex;gap:6px}
  .restbar .pill{padding:9px 12px}
  .rbar{height:6px;background:var(--fill);border-radius:4px;overflow:hidden;margin-top:10px}
  .rbar div{height:100%;background:var(--accent2);border-radius:4px;transition:width .25s linear}
  .optgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{background:var(--fill);font-variant-numeric:tabular-nums}
  .opt.on{background:var(--accent);color:var(--accent-ink)}
  .summary{text-align:center;padding-top:30px}
  .sumic{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(46,138,78,.35)}
  .sumic svg{width:36px;height:36px}
  .goal{padding:11px 0;border-bottom:1px solid var(--line)}
  .goal:last-child{border-bottom:none}
  .goal .top2{display:flex;justify-content:space-between;font-size:15px}
  .goal .top2 b{font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .seg{display:flex;gap:3px;margin:10px 0}
  .seg div{flex:1;height:6px;border-radius:3px;background:var(--fill)}
  .seg div.w{background:var(--soft)} .seg div.cur{background:var(--accent2)} .seg div.d{background:var(--ok)}
  .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .macro{display:grid;grid-template-columns:72px 1fr 92px;align-items:center;gap:10px;font-size:14px;padding:4px 0}
  .macro .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .preset{border-radius:20px;padding:11px 13px;text-align:left;font-weight:600;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:64px}
  .preset span{font-weight:400;color:var(--muted);font-size:12px}
  .daynav{display:flex;gap:6px;flex-shrink:0}
  .phase{display:flex;gap:3px;margin:10px 0 4px}
  .phase div{height:6px;border-radius:3px;background:var(--fill)}
  .phase div.cur{background:var(--accent2)}
  .inline{display:flex;gap:8px;align-items:center}
  .live{color:var(--warn);font-weight:600;font-size:13px}
</style>
</head>
<body>
<div id="scroller"><div class="wrap">
  <section id="v-heute"></section>
  <section id="v-woche" class="hidden"></section>
  <section id="v-essen" class="hidden"></section>
  <section id="v-fortschritt" class="hidden"></section>
</div></div>

<div class="modal hidden" id="sessModal"><div class="sheet" id="sessSheet"></div></div>
<div class="modal hidden" id="dlgModal"><div class="sheet" id="dlgSheet"></div></div>

<nav>
  <button data-v="heute" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Heute</button>
  <button data-v="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>Woche</button>
  <button data-v="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M16.5 21V3c-2 1.5-3 4-3 7s1.3 4 3 4"/></svg>Essen</button>
  <button data-v="fortschritt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg>Fortschritt</button>
</nav>

<script>
(function(){
"use strict";
/* =================== Helfer =================== */
var $ = function(id){ return document.getElementById(id); };
function toTop(){ var sc=document.getElementById("scroller"); if(sc) sc.scrollTop=0; }
/* Kein Federn/Seitwärtsschieben: nur echte Scrollbereiche dürfen vertikal scrollen, und nicht über den Rand hinaus */
(function(){ var sx=0, sy=0, box=null;
  document.addEventListener("touchstart",function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; box=e.target.closest?e.target.closest(".modal .sheet, #scroller"):null; },{passive:true});
  document.addEventListener("touchmove",function(e){ if(e.touches.length>1) return; var t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(!box || box.scrollHeight<=box.clientHeight+1){ e.preventDefault(); return; }
    if(Math.abs(dx)>Math.abs(dy)){ e.preventDefault(); return; }
    var top=box.scrollTop<=0, bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-1;
    if((top&&dy>0)||(bottom&&dy<0)) e.preventDefault(); },{passive:false});
})();
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }
function parseD(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function fmtD(d){ return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+d.getFullYear(); }
function fmtDs(d){ return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."; }
function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function num(v){ return parseFloat(String(v).replace(",",".")); }
function f1(x){ return (Math.round(x*10)/10).toString().replace(".",","); }
function f2(x){ return (Math.round(x*100)/100).toString().replace(".",","); }
function mmss(sec){ if(sec==null||!isFinite(sec)) return "–"; sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m+":"+("0"+s).slice(-2); }
function hms(sec){ sec=Math.max(0,Math.floor(sec)); var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return (h?h+":"+("0"+m).slice(-2):m)+":"+("0"+s).slice(-2); }
function paceStr(kmh){ if(!kmh||!isFinite(kmh)) return "–"; return mmss(3600/kmh)+" /km"; }
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
var DAYS=["So","Mo","Di","Mi","Do","Fr","Sa"];

/* =================== Zustand =================== */
var KEY="bftcoach_v1";
var S={ start:"2026-11-23", dienst:"2027-04-01", offset:0, voice:true, logs:[], weights:[], creatine:{}, food:{}, presets:[] };
(function(){ var r=lsGet(KEY); if(r){ try{ Object.assign(S, JSON.parse(r)); }catch(e){} } if(!S.v2){ if(S.dienst==="2027-01-01") S.dienst="2027-04-01"; S.v2=1; } })();
function save(){ lsSet(KEY, JSON.stringify(S)); }

/* =================== Plan-Engine (wissenschaftliche Logik) =================== */
function startD(){ return parseD(S.start); }
function dienstD(){ return parseD(S.dienst); }
function calWeek(d){ return Math.floor((d - startD())/864e5/7)+1; }
function planWeek(d){ return calWeek(d) - (S.offset||0); }
function mondayOf(d){ var x=new Date(d); var dw=x.getDay(); return addDays(x, dw===0?-6:1-dw); }
// Phasen relativ zum Dienstantritt: Taper 14 Tage (Bosquet 2007), davor 3 Wochen BFT-spezifisch, davor 8 Wochen VO2max, davor Grundlage
function phaseOf(d){
  var dn=dienstD();
  var taper=addDays(dn,-14), b3=addDays(taper,-21), b2=addDays(b3,-56);
  if(d>=dn) return {key:"dienst",name:"Dienstantritt",short:"Dienst"};
  if(d>=taper) return {key:"taper",name:"Taper · Formspitze",short:"Taper"};
  if(d>=b3) return {key:"b3",name:"Block 3 · BFT-spezifisch",short:"Block 3"};
  if(d>=b2) return {key:"b2",name:"Block 2 · VO2max",short:"Block 2"};
  return {key:"b1",name:"Block 1 · Grundlage",short:"Block 1"};
}
function weekMonday(w){ return addDays(startD(),(w-1+(S.offset||0))*7); }
function taperStart(){ return addDays(dienstD(),-14); }
function isDeload(w,ph){ var dl = w<=12 ? (w===4||w===8) : ((w-13)%4===0); if(!(w>0 && dl) || ph.key==="taper") return false; return (taperStart()-weekMonday(w))/864e5 >= 21; }
function isTestFriday(w,d){ var ph=phaseOf(d); if(ph.key==="taper"||ph.key==="dienst") return false; if(isDeload(w,ph)) return true; var fri=addDays(weekMonday(w),4), next=addDays(fri,7); return fri<taperStart() && next>=taperStart(); }
function reduced(w,ph){ return isDeload(w,ph) || ph.key==="taper"; }

// Mittwoch: Wochen 1–12 Marsch-Aufbau; danach Marsch nur alle 2 Wochen (Knapik: 2x/Monat ≈ 4x/Monat bei Lauf+Kraft)
function wedPlan(w,d){
  var ph=phaseOf(d);
  if(w<1) w=1;
  if(ph.key==="taper") return {km:"8",kmT:8,kg:15,type:"marsch",focus:"Taper: kurzer, lockerer Marsch",kcal:400};
  if(w<=12) return PLAN12[w-1];
  if(isDeload(w,ph)) return {km:"5",kmT:5,kg:0,type:"lauf",focus:"Entlastung: lockerer Lauf ohne Gepäck",kcal:0};
  var k=w-13;
  var boots=(d.getMonth()>=6&&d.getMonth()<=8)?" · in Stiefeln":"";
  if(k%2===1){ var m=(k+1)/2;
    if(m%2===1) return {km:"18–20",kmT:19,kg:20,type:"marsch",focus:"Marsch A: lang & schwer"+boots,kcal:1000};
    return {km:"12",kmT:12,kg:20,type:"marsch",focus:"Marsch B: kürzer & zügig (6,5 km/h)"+boots,kcal:650};
  }
  return {km:"",kmT:0,min:50,kg:0,type:"long",focus:"Langer lockerer Lauf 45–60 Min. (Grundlage, 80/20-Prinzip)",kcal:300};
}
// Donnerstag: Intervalle
function intervalPlan(w,d){
  var ph=phaseOf(d);
  if(isDeload(w,ph)) return null;
  if(w<=2 && ph.key!=="b1" && ph.key!=="taper") return {kind:"time",reps:4+w,work:120,rest:120,label:"Intervalle "+(4+w)+"×2 Min. (Einstieg)"};
  if(ph.key==="b1"){ var idx=((w-1)%4); var reps=[5,6,7][Math.min(idx,2)]; if(w>4){ var r3=Math.min(5+Math.floor((w-1)/4),7); return {kind:"time",reps:r3,work:180,rest:120,label:"Intervalle "+r3+"×3 Min."}; } return {kind:"time",reps:reps,work:120,rest:120,label:"Intervalle "+reps+"×2 Min."}; }
  if(ph.key==="b2"){ var bi=Math.floor((weekMonday(w)-addDays(taperStart(),-77))/864e5/7), up=bi>=3?1:0; return (w%2===1)?{kind:"time",reps:5+up,work:180,rest:120,label:"VO2max "+(5+up)+"×3 Min."}:{kind:"time",reps:4+up,work:240,rest:180,label:"VO2max "+(4+up)+"×4 Min."}; }
  if(ph.key==="b3") return {kind:"dist",blocks:[{reps:3,m:500,rest:240,pace:"goal"},{reps:6,m:200,rest:120,pace:"fast"}],label:"BFT-spezifisch 3×500 m + 6×200 m"};
  if(ph.key==="taper") return {kind:"dist",blocks:[{reps:2,m:500,rest:240,pace:"goal"},{reps:3,m:200,rest:120,pace:"fast"}],label:"Taper: 2×500 m + 3×200 m"};
  return null;
}
function fridayPlan(w,d){
  var ph=phaseOf(d);
  if(isTestFriday(w,d)) return {type:"test"};
  if(ph.key==="taper") return {type:"run",min:25};
  return {type:"run",min:Math.min(25+2*Math.max(0,w-1),45)};
}

function dayUnits(d){
  var w=planWeek(d), ph=phaseOf(d), dow=d.getDay(), u=[];
  if(w<1 || ph.key==="dienst") return u;
  if((dienstD()-d)/864e5<=2.5) return u; // letzte 2 Tage vor Dienstantritt: Ruhe
  if(dow===1) u.push({kind:"gym",key:"LA"});
  if(dow===2) u.push({kind:"gym",key:"UA"});
  if(dow===3){ var wp=wedPlan(w,d); u.push({kind: wp.type==="marsch"?"march":"run", plan:wp}); }
  if(dow===4){ var ip=intervalPlan(w,d); if(ip) u.push({kind:"interval",plan:ip}); u.push({kind:"gym",key:"UB"}); }
  if(dow===5 && isTestFriday(w,d)){ u.push({kind:"test"}); return u; }
  if(dow===5){ var fp=fridayPlan(w,d); if(fp.type==="test") u.push({kind:"test"}); else u.push({kind:"run",plan:{type:"easy",min:fp.min,focus:"Lockerer Lauf im Plauder-Tempo + 4–6 Steigerungen à 80 m"}}); }
  if(dow===6) u.push({kind:"gym",key:"LB"});
  return u;
}
function unitDone(d,unit){
  var ds=iso(d);
  return S.logs.some(function(l){ if(l.date!==ds) return false;
    if(unit.kind==="gym") return l.type==="gym"&&l.key===unit.key;
    if(unit.kind==="march") return l.type==="march";
    if(unit.kind==="run") return l.type==="run";
    if(unit.kind==="interval") return l.type==="interval";
    if(unit.kind==="test") return l.type==="test";
    return false; });
}

function tests(){ return S.logs.filter(function(l){return l.type==="test";}).sort(function(a,b){return a.date<b.date?-1:1;}); }
function bestOf(field, better){
  var v=null; S.logs.forEach(function(l){
    var x=null;
    if(l.type==="test") x=l[field];
    if(field==="hang" && l.type==="gym" && l.ex) l.ex.forEach(function(e){ if(e.t==="hold") e.sets.forEach(function(s){ if(s.done&&s.sec) x=Math.max(x||0,s.sec); }); });
    if(field==="sprint" && l.type==="gym" && l.sprints) l.sprints.forEach(function(s){ x = x==null? s : Math.min(x,s); });
    if(x!=null && x>0){ if(v==null || (better==="low"? x<v : x>v)) v=x; }
  }); return v;
}
function lastTest(field){ var t=tests().filter(function(x){return x[field];}); return t.length? t[t.length-1][field] : null; }
function goal1000(){ var t=lastTest("run1000"); if(!t) return 230; return Math.max(210, Math.min(230, t-15)); }
function hangProtocol(){
  var b=bestOf("hang","high");
  if(b==null) return {txt:"Noch kein Wert: halte so lange du kannst und trag die Zeit ein.",sets:null};
  if(b<30) return {txt:"Beste Zeit "+Math.round(b)+" s : 5× 10–15 s halten (60 s Pause) + 3 langsame Negativ-Klimmzüge.",sets:5};
  if(b<45) return {txt:"Beste Zeit "+Math.round(b)+" s : 3× maximal halten, 3 Min. Pause.",sets:null};
  return {txt:"Beste Zeit "+Math.round(b)+" s : 3× maximal mit +2,5–5 kg Zusatzgewicht.",sets:null};
}

/* =================== GPS-Tracker =================== */
function Tracker(){ this.dist=0; this.last=null; this.win=[]; this.id=null; this.status="aus"; this.acc=null; this.active=false; }
Tracker.prototype.hav=function(a,b){ var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r; var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2); return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); };
Tracker.prototype.start=function(cb){ var me=this; me.cb=cb; me.active=true; if(me.id!==null) return; if(!navigator.geolocation){ me.status="nicht verfügbar"; return; } me.status="suche Signal…"; me.last=null; me.win=[];
  try{ me.id=navigator.geolocation.watchPosition(function(p){ me.onPos(p); }, function(e){ me.status=e.code===1?"verweigert – Standort erlauben":"kein Signal"; if(me.cb) me.cb(); }, {enableHighAccuracy:true,maximumAge:1000,timeout:20000}); }catch(e){ me.status="nicht verfügbar"; } };
Tracker.prototype.stop=function(){ try{ if(this.id!==null) navigator.geolocation.clearWatch(this.id); }catch(e){} this.id=null; this.last=null; this.win=[]; this.active=false; this.status="aus"; };
Tracker.prototype.onPos=function(pos){ var c=pos.coords,t=Date.now(); this.acc=c.accuracy;
  if(c.accuracy>35){ this.status="ungenau (±"+Math.round(c.accuracy)+" m)"; if(this.cb) this.cb(); return; }
  this.status="aktiv (±"+Math.round(c.accuracy)+" m)"; var p={lat:c.latitude,lon:c.longitude,t:t};
  if(this.last){ var d=this.hav(this.last,p), dt=(t-this.last.t)/1000; if(dt<=0) return; var v=d/dt*3.6;
    if(d<Math.max(3,c.accuracy*0.3)){ if(this.cb) this.cb(); return; } if(v>30){ this.last=p; return; }
    this.dist+=d/1000; this.win.push({t:t,d:d}); }
  this.last=p; var cut=t-60000; while(this.win.length&&this.win[0].t<cut) this.win.shift(); if(this.cb) this.cb(); };
Tracker.prototype.speed=function(){ if(this.win.length<3) return null; var span=(this.win[this.win.length-1].t-this.win[0].t)/1000; if(span<25) return null; var d=this.win.reduce(function(s,x){return s+x.d;},0); return d/span*3.6; };

function nutrition(d){
  // Basis = Ruhetag (Erhaltung ohne Training). Zuschläge nach geschätztem Mehrverbrauch der Einheit (~78 kg Körpergewicht).
  var units=dayUnits(d), extra=0, label="Ruhetag", tips=[], gym=false;
  units.forEach(function(u){
    if(u.kind==="gym"){ gym=true; if(label==="Ruhetag") label="Krafttag"; }
    if(u.kind==="march"){ extra+=u.plan.kcal; label="Marschtag"; tips.push("Vorher kohlenhydratreich frühstücken, unterwegs Wasser (und ab 90 Min. ein Snack)."); }
    if(u.kind==="interval"){ extra+=300; label="Intervalltag"; tips.push("2–3 Std. vor der Bahn eine kohlenhydratreiche Mahlzeit, 30–45 Min. vorher dein Apfelsaft."); }
    if(u.kind==="run"){ var p=u.plan, mins=p.type==="long"?50:p.type==="easy"?p.min:(p.kmT||5)*6; extra+=Math.round(mins*9/50)*50; label="Lauftag"; }
    if(u.kind==="test"){ extra+=250; label="Testtag"; tips.push("Testtag: gut frühstücken, ggf. ~230 mg Koffein 1 Std. vorher (nur wenn im Training getestet)."); }
  });
  if(gym) extra+=100;
  var corr=S.kcalAdj||0, kcal=2850+extra+corr, p=160, f=75, c=Math.round((kcal-p*4-f*9)/4);
  return {label:label,kcal:kcal,p:p,c:c,f:f,tips:tips,gkg:c/(lastWeight()||77.6)};
}

  if(u.kind==="run"){ var p=u.plan; if(p.type==="easy") return {ic:IC.run,t:"Lockerer Lauf",m:p.min+" Min. Plauder-Tempo + Steigerungen"}; if(p.type==="long") return {ic:IC.run,t:"Langer Lauf",m:"45–60 Min. locker"}; return {ic:IC.run,t:"Lauf "+p.km+" km",m:"locker, ohne Gepäck"}; }

function bindUnits(el){ Array.prototype.forEach.call(el.querySelectorAll("[data-u]"),function(r){ r.onclick=function(){ var d=parseD(r.getAttribute("data-d")); openUnit(dayUnits(d)[+r.getAttribute("data-u")], d); }; }); }

function lastWeight(){ return S.weights.length? S.weights[S.weights.length-1].kg : null; }
function weightAdvice(){
  var ws=S.weights; if(ws.length<2) return '<div class="muted small" style="margin-top:8px">Ziel 77–79 kg. Einmal pro Woche morgens nüchtern wiegen.</div>';
  var last=ws[ws.length-1], ref=null; for(var i=ws.length-2;i>=0;i--){ if((parseD(last.date)-parseD(ws[i].date))/864e5>=21){ ref=ws[i]; break; } }
  if(!ref) return '<div class="muted small" style="margin-top:8px">Ziel 77–79 kg. Trend nach 3 Wochen Messungen.</div>';
  var days=(parseD(last.date)-parseD(ref.date))/864e5, pm=(last.kg-ref.kg)/days*30, txt=(pm>0?'+':'')+f1(pm)+' kg/Monat';
  if(last.kg>79.5||pm>0.6) return '<div class="fb warn">Trend '+txt+' – zu schnell.</div><div class="btnrow"><button class="btn2" data-adj="-150">Kalorien −150</button></div>';
  if(last.kg<76.5||pm<-0.8) return '<div class="fb warn">Trend '+txt+' – Gewicht fällt.</div><div class="btnrow"><button class="btn2" data-adj="150">Kalorien +150</button></div>';
  return '<div class="muted small" style="margin-top:8px">Trend '+txt+' · im Zielbereich</div>';
}
function goalsCard(){
  var sp=bestOf("sprint","low"), hg=bestOf("hang","high"), r=bestOf("run1000","low");
  function g(name,val,fmt,goal,goalTxt,lowBetter,worst){ var pct=0; if(val!=null){ pct= lowBetter? (worst-val)/(worst-goal)*100 : (val-worst)/(goal-worst)*100; pct=Math.max(3,Math.min(100,pct)); }
    return '<div class="goal"><div class="top2"><span>'+name+'</span><span><b>'+(val!=null?fmt(val):'–')+'</b> <span class="muted">/ '+goalTxt+'</span></span></div><div class="bar"><div style="width:'+pct+'%"></div></div></div>'; }
  return '<div class="card">'+g("Pendellauf 11×10 m",sp,function(v){return f1(v)+" s";},42,"42 s",true,60)+g("Klimmhang",hg,function(v){return Math.round(v)+" s";},60,"60 s",false,5)+g("1000 m",r,function(v){return mmss(v);},230,"3:50",true,390)+'</div>';
}

function renderWoche(){
  var el=$("v-woche"), t=today0(), cw=Math.max(1,planWeek(t));
  if(weekView==null) weekView=cw;
  var w=weekView, mon=weekMonday(w), ph=phaseOf(addDays(mon,3)), endW=planWeek(addDays(dienstD(),-1));

  var h='<div class="top"><div><h1>Woche '+w+'</h1><div class="sub">'+sub+'</div></div><div class="daynav"><button class="iconbtn" id="wPrev" '+(w<=1?'disabled':'')+'>'+IC.left+'</button><button class="iconbtn" id="wNext" '+(w>=endW?'disabled':'')+'>'+IC.chev+'</button><button class="iconbtn" data-settings>'+IC.gear+'</button></div></div>';
  for(var i=0;i<7;i++){ var d=addDays(mon,i), past=d<t, isT=+d===+t;
    h+='<div class="sec" style="margin-top:12px">'+DAYLONG[d.getDay()]+' <span class="muted small" style="font-weight:500">'+fmtDs(d)+(isT?' · heute':'')+'</span></div><div class="card">'+unitRows(d,true)+'</div>'; }
  // Phasen
  var dn=dienstD(), tp=taperStart(), b3=addDays(tp,-21), b2=addDays(b3,-56), st0=startD(), total=(dn-st0)/864e5;
  var parts=[["b1","Grundlage",st0,b2],["b2","VO2max",b2,b3],["b3","BFT-spezifisch",b3,tp],["taper","Formspitze",tp,dn]].filter(function(p){return p[3]>st0;}).map(function(p){ if(p[2]<st0) p[2]=st0; return p; });
  h+='<div class="sec">Phasen bis zum Dienstantritt</div><div class="card pad"><div class="phase">'+parts.map(function(p){ return '<div class="'+(phaseOf(t).key===p[0]?'cur':'')+'" style="flex:'+((p[3]-p[2])/864e5/total)+'"></div>'; }).join("")+'</div>';
  h+='<table>'+parts.map(function(p){ return '<tr class="'+(phaseOf(t).key===p[0]?'cur':'')+'"><td>'+p[1]+'</td><td class="muted">'+fmtDs(p[2])+' – '+fmtDs(addDays(p[3],-1))+'</td></tr>'; }).join("")+'<tr><td>Dienstantritt</td><td class="muted">'+fmtD(dn)+'</td></tr></table></div>';
  el.innerHTML=h; bindTop(el); bindUnits(el);
  $("wPrev").onclick=function(){ if(weekView>1){ weekView--; render(); toTop();} };
  $("wNext").onclick=function(){ if(weekView<endW){ weekView++; render(); toTop();} };
}

function logTitle(l){ return l.type==="gym"?(GYM[l.key]?GYM[l.key].title:"Gym"):l.type==="march"?"Marsch":l.type==="run"?"Lauf":l.type==="interval"?"Intervalle":l.type==="test"?"BFT-Test":l.type; }
function logSub(l){

function lineChart(pts,label,goal,lowBetter){

}

/* ---------- GPS-Lauf / Marsch ---------- */

function paintG(){ if(!G) return; var sec=gElapsed(), d=G.trk.dist, avg=sec>60&&d>0.05?d/(sec/3600):null, cs=G.trk.speed();
  var e; if((e=$("gD"))) e.textContent=f2(d)+" km"; if((e=$("gC"))) e.textContent=cs?f1(cs)+" km/h":"–"; if((e=$("gA"))) e.textContent=avg?f1(avg)+" km/h":"–"; if((e=$("gP"))) e.textContent=paceStr(cs||avg); if((e=$("gG"))) e.textContent="GPS: "+G.trk.status;

    var kmh=k/(m/60), e={id:uid(),date:G.date,week:G.week,type:isM?"march":"run",km:Math.round(k*100)/100,sec:m*60,kmh:Math.round(kmh*100)/100,knee:knee};
    if(isM){ e.kg=num($("fKg").value)||0; e.blister=$("fBl").checked; }
    S.logs.push(e); save(); lsDel("bft_live");
    var out=[]; if(isM) out.push(judge(kmh)); else out.push({c:"ok",t:"Lauf gespeichert: "+f2(k)+" km, "+paceStr(kmh)+"."});
    if(isM&&p.test===120&&k>=12) out.push(m<=120?{c:"ok",t:"AGA-Test bestanden ("+m+" Min.)."}:{c:"warn",t:"AGA-Test: "+m+" Min., Ziel < 120."});
    if(knee>=4) out.push({c:"bad",t:"Schmerz "+knee+"/10: Nächste Woche nicht steigern – „Diese Woche wiederholen“ (Zahnrad). Bleibt es: ärztlich abklären."}); else if(knee>=2) out.push({c:"warn",t:"Leichter Schmerz – beobachten. In 2 Tagen nicht weg? Woche wiederholen."});
    if(e.blister) out.push({c:"warn",t:"Blasen versorgen, Druckstellen vorher abkleben."});
    if(isM&&p.kcal) out.push({c:"info",t:"Heute +"+p.kcal+" kcal extra (v. a. Kohlenhydrate)."});
    G=null; $("sessSheet").innerHTML='<h3 style="margin-top:0">Gespeichert</h3>'+out.map(function(o){return '<div class="fb '+o.c+'">'+esc(o.t)+'</div>';}).join("")+'<div class="btnrow"><button class="btn" id="fDone">Fertig</button></div>';
    $("fDone").onclick=closeSess; say(out[0].t); };
}

/* ---------- BFT-Test ---------- */
function testSession(d){
  var T={sprint:"",hang:"",run1000:""}, step=0;
  function draw(){
    var h='<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800;font-size:18px">BFT-Test</div><button class="pill" id="tClose">Schließen</button></div>';
    h+='<p class="muted small">Gut aufwärmen (10 Min. + Steigerungen). Reihenfolge wie im echten BFT. Pausen: 5 Min. nach Pendellauf, 10 Min. vor 1000 m.</p>';
    var names=["Pendellauf 11×10 m","Klimmhang (Kammgriff)","1000 m (2,5 Runden)"], keys=["sprint","hang","run1000"];
    keys.forEach(function(k,i){ var v=T[k];
      h+='<div class="unit"><div class="t">'+(i+1)+'. '+names[i]+' '+(v?'<span class="tag g">'+(k==="run1000"?mmss(v):f1(v)+" s")+'</span>':'')+'</div>';
      if(i===step){ h+='<div class="timer" id="tT" style="font-size:44px">0,0</div><div class="btnrow"><button class="btn" id="tGo">Start</button><button class="btn-danger" id="tStop">Stopp</button></div>'+
        '<label>oder Zeit manuell ('+(k==="run1000"?"m:ss":"Sek.")+')</label><div style="display:flex;gap:8px"><input id="tMan" placeholder="'+(k==="run1000"?"3:58":"44,5")+'"><button class="btn2 mini" id="tSet">Übernehmen</button></div>'+(i<2?'<div class="btnrow"><button class="ghost" id="tSkip">Disziplin überspringen</button></div>':''); }
      h+='</div>'; });
    h+='<div class="btnrow"><button class="btn" id="tSave">Test speichern</button></div>';
    $("sessSheet").innerHTML=h;
    $("tClose").onclick=function(){ stopSW2(); closeSess(); };
    var key=keys[step];
    if($("tGo")) $("tGo").onclick=function(){ initAudio(); wake(true); var c=3; $("tT").textContent=c; beep(700,120); var cd=setInterval(function(){ c--; if(c>0){ $("tT").textContent=c; beep(700,120);} else { clearInterval(cd); beep(1150,300); sw2.t0=performance.now(); sw2.iv=setInterval(function(){ var s=(performance.now()-sw2.t0)/1000; var el=$("tT"); if(el) el.textContent= key==="run1000"? mmss(s) : f1(s); },100); } },1000); };
    if($("tStop")) $("tStop").onclick=function(){ var t=stopSW2(); if(t>1){ T[key]=Math.round(t*10)/10; announce(key,T[key]); step=Math.min(step+1,2); draw(); } };
    if($("tSkip")) $("tSkip").onclick=function(){ stopSW2(); step=Math.min(step+1,2); draw(); };
    if($("tSet")) $("tSet").onclick=function(){ var v=$("tMan").value.trim(), s; if(key==="run1000"){ var p=v.split(":"); s=p.length===2?(+p[0])*60+num(p[1]):num(v); } else s=num(v); if(s>0){ T[key]=s; step=Math.min(step+1,2); draw(); } };
    $("tSave").onclick=function(){ if(!T.sprint&&!T.hang&&!T.run1000) return; S.logs.push({id:uid(),date:iso(d),week:planWeek(d),type:"test",sprint:T.sprint||null,hang:T.hang||null,run1000:T.run1000||null}); save(); wake(false); closeSess();
      var fb=[]; if(T.sprint) fb.push(T.sprint<42?{c:"ok",t:"Pendellauf "+f1(T.sprint)+" s – sehr gut!"}:{c:"warn",t:"Pendellauf "+f1(T.sprint)+" s – Ziel < 42 s."});
      if(T.hang) fb.push(T.hang>=60?{c:"ok",t:"Klimmhang "+Math.round(T.hang)+" s – Topwert!"}:{c:"warn",t:"Klimmhang "+Math.round(T.hang)+" s – Ziel 60 s."});
      if(T.run1000) fb.push(T.run1000<=230?{c:"ok",t:"1000 m in "+mmss(T.run1000)+" – unter 3:50!"}:{c:"warn",t:"1000 m in "+mmss(T.run1000)+" – Ziel < 3:50. Intervall-Tempos werden jetzt daran angepasst."});
      openDlg('<h3 style="margin-top:0">Test gespeichert</h3>'+fb.map(function(o){return '<div class="fb '+o.c+'">'+esc(o.t)+'</div>';}).join("")+'<div class="btnrow"><button class="btn" id="tOk">OK</button></div>'); $("tOk").onclick=closeDlg; };
  }
  draw();
}
var sw2={t0:null,iv:null};
function stopSW2(){ if(sw2.t0==null) return 0; var t=(performance.now()-sw2.t0)/1000; clearInterval(sw2.iv); sw2.t0=null; beep(600,250); return t; }
function announce(k,v){ if(k==="sprint") say(f1(v).replace(","," Komma ")+" Sekunden. Jetzt 5 Minuten Pause, dann Klimmhang."); if(k==="hang") say(Math.round(v)+" Sekunden. 10 Minuten Pause, dann 1000 Meter."); if(k==="run1000") say(mmss(v).replace(":"," Minuten ")+" Sekunden."); }

/* =================== Start =================== */
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&(IV||G)) wake(true); });
try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(e){}
show("heute");
var pend=lsGet("bft_live"); if(pend){ try{ var po=JSON.parse(pend); if(po&&po.start){ $("sessModal").classList.remove("hidden"); gpsSession(po.kind,po.plan,parseD(po.date)); } }catch(e){} }
})();
</script>
